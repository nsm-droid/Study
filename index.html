<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার পড়ার সাথী</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ff;--card:rgba(255,255,255,.72);--tx:#1b1840;--mu:#5d5a85;--pr:#7c3aed;--pr2:rgba(124,58,237,.1);--ok:#059669;--bd:rgba(124,58,237,.2);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a1f;--card:rgba(30,27,75,.55);--tx:#f1f0ff;--mu:#a5a3d6;--pr:#a78bfa;--pr2:rgba(167,139,250,.15);--ok:#34d399;--bd:rgba(167,139,250,.28)}}
:root[data-theme="dark"]{--bg:#0b0a1f;--card:rgba(30,27,75,.55);--tx:#f1f0ff;--mu:#a5a3d6;--pr:#a78bfa;--pr2:rgba(167,139,250,.15);--ok:#34d399;--bd:rgba(167,139,250,.28)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.95rem}
nav{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--bd);margin-bottom:14px}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.sec{display:none}.sec.on{display:block}
.time{font-size:4rem;font-weight:700;text-align:center;letter-spacing:2px;margin:6px 0;font-variant-numeric:tabular-nums}
.mode{text-align:center;color:var(--mu);font-weight:600}
.row{display:flex;gap:8px;margin-top:12px}
button.b,.row button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer;background:var(--pr);color:#fff}
button.g{background:var(--pr2)!important;color:var(--pr)!important}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:var(--pr2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--pr)}
.stat span{font-size:.85rem;color:var(--mu)}
input,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px;font:inherit}
.bar{height:8px;background:var(--pr2);border-radius:99px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
ul{list-style:none;padding:0;margin:10px 0 0}
li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd)}
li input{width:20px;height:20px;flex:none;accent-color:var(--pr)}
li span{flex:1}li.d span{text-decoration:line-through;color:var(--mu)}
li button{border:0;background:none;color:var(--mu);font-size:1.1rem;cursor:pointer}
.fc{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;font-weight:600;background:var(--pr2);color:var(--tx);border-radius:16px;padding:20px;cursor:pointer;margin-bottom:6px}
.hint{text-align:center;color:var(--mu);font-size:.85rem}
.empty{color:var(--mu);text-align:center;padding:10px}
.add{display:grid;gap:8px;margin-top:16px}
.chat{max-height:50vh;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.m{padding:10px 12px;border-radius:14px;white-space:pre-wrap;max-width:92%}
.m.u{background:var(--pr);color:#fff;align-self:flex-end}
.m.a{background:var(--pr2);align-self:flex-start}
#ai-st{margin-top:6px}

body{background:radial-gradient(circle at 12% 0%,rgba(124,58,237,.45),transparent 42%),radial-gradient(circle at 95% 18%,rgba(236,72,153,.38),transparent 40%),radial-gradient(circle at 50% 100%,rgba(6,182,212,.32),transparent 45%),var(--bg);background-attachment:fixed;min-height:100vh}
h1{font-size:1.7rem;background:linear-gradient(90deg,#7c3aed,#ec4899,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.card,nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(124,58,237,.18)}
nav{overflow-x:auto}nav button{font-size:.8rem;padding:9px 2px;white-space:nowrap;transition:.2s}
nav button.on,.row button:not(.g),button.b:not(.g){background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;box-shadow:0 4px 18px rgba(236,72,153,.4)}
.row button,button.b{transition:transform .15s}.row button:active,button.b:active{transform:scale(.96)}
.time{font-size:4.4rem;background:linear-gradient(135deg,#7c3aed,#ec4899,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(236,72,153,.45))}
.time.run{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{filter:drop-shadow(0 0 26px rgba(6,182,212,.8))}}
.stat b{background:linear-gradient(90deg,#7c3aed,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar i{background:linear-gradient(90deg,#06b6d4,#34d399);box-shadow:0 0 10px #34d399}
.fc{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(236,72,153,.25));border:1px solid var(--bd)}
.m.u{background:linear-gradient(135deg,#7c3aed,#ec4899)}
.qq{font-size:1.15rem;font-weight:700;margin:6px 0 10px}
.qo{display:block;width:100%;text-align:left;margin-top:8px;padding:13px;border-radius:14px;border:2px solid var(--bd);background:var(--pr2);color:var(--tx);font:inherit;cursor:pointer;transition:.2s}
.qo.ok{border-color:#34d399;background:rgba(52,211,153,.25);box-shadow:0 0 18px rgba(52,211,153,.55)}
.qo.no{border-color:#f43f5e;background:rgba(244,63,94,.25);box-shadow:0 0 18px rgba(244,63,94,.5);animation:sk .35s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#al{animation:pl .6s infinite}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav small{font-size:.7rem}
.set{display:flex;gap:8px;margin-top:14px}.set label{flex:1;font-size:.85rem;color:var(--mu)}.set input{margin-top:4px;text-align:center;font-weight:700}
textarea#nt{min-height:50vh;resize:vertical}
</style>
</head>
<body>
<main>
<h1>📚 আমার পড়ার সাথী</h1>
<p class="sub">মনোযোগ দাও, লক্ষ্য ঠিক করো, মুখস্থ করো।</p>
<nav>
<button class="on" data-t="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><small>টাইমার</small></button>
<button data-t="tasks"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/></svg><small>টাস্ক</small></button>
<button data-t="cards"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 7V5a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2h-2"/></svg><small>কার্ড</small></button>
<button data-t="ai" id="aiTab"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><small>এআই</small></button>
<button data-t="quiz" id="qTab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><small>কুইজ</small></button>
<button data-t="notes"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h6"/></svg><small>নোট</small></button>
<button data-t="exam"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><small>পরীক্ষা</small></button>
</nav>

<section id="timer" class="sec on card">
<div class="mode" id="mode">পড়ার সময়</div>
<div class="time" id="time">25:00</div>
<div class="row"><button id="go">শুরু</button><button class="g" id="rs">রিসেট</button></div>
<div class="row"><button class="g" id="m1">পড়ার মোড</button><button class="g" id="m2">বিরতির মোড</button></div>
<div class="set"><label>পড়া (মিনিট)<input id="fmI" type="number" min="1" max="180"></label><label>বিরতি (মিনিট)<input id="bmI" type="number" min="1" max="60"></label></div>
<div class="row"><button class="g" data-pre="25,5">২৫/৫</button><button class="g" data-pre="50,10">৫০/১০</button><button class="g" data-pre="90,20">৯০/২০</button></div>
<button class="b" id="al" style="display:none;width:100%;margin-top:12px">🔔 এলার্ম বন্ধ করো</button>
<div class="stats">
<div class="stat"><b id="sMin">0</b><span>আজ পড়েছি (মিনিট)</span></div>
<div class="stat"><b id="sSes">0</b><span>সেশন সম্পন্ন</span></div>
<div class="stat"><b id="sStr">0</b><span>দিনের স্ট্রিক 🔥</span></div>
</div>
</section>

<section id="tasks" class="sec card">
<div class="row" style="margin-top:0"><input id="ti" placeholder="যেমন: পদার্থবিজ্ঞান ৩ অধ্যায়"><button style="flex:none;padding:0 18px" id="ta">যোগ</button></div>
<div class="bar"><i id="pb"></i></div>
<div class="hint" id="pt"></div>
<ul id="tl"></ul>
</section>

<section id="cards" class="sec card">
<div class="fc" id="fc"></div>
<div class="hint" id="fh"></div>
<div class="row"><button class="g" id="pv">← আগের</button><button class="g" id="sh">🔀</button><button class="g" id="nx">পরের →</button></div>
<div class="row"><button class="g" id="fd">এই কার্ড মুছো</button></div>
<div class="add">
<input id="fq" placeholder="প্রশ্ন / শব্দ">
<textarea id="fa" rows="2" placeholder="উত্তর / অর্থ"></textarea>
<button class="b" id="fadd">কার্ড যোগ করো</button>
</div>
</section>
<section id="ai" class="sec card">
<div class="row" style="margin-top:0;flex-wrap:wrap">
<button class="g" data-p="explain">💡 সহজ ব্যাখ্যা</button>
<button class="g" data-p="quiz">❓ কুইজ</button>
<button class="g" data-p="summary">📝 সারাংশ</button>
<button class="g" data-p="cards">🃏 কার্ড বানাও</button>
</div>
<div id="chat" class="chat"><div class="empty">যত খুশি প্রশ্ন করো, আমি বাংলায় সাহায্য করব।</div></div>
<div class="row"><textarea id="ai-in" rows="2" placeholder="যেমন: নিউটনের তৃতীয় সূত্র বুঝিয়ে দাও"></textarea><button style="flex:none;padding:0 18px" id="ai-go">পাঠাও</button></div>
<div class="hint" id="ai-st"></div>
<button class="b g" id="ai-new" style="width:100%;margin-top:8px">নতুন চ্যাট শুরু করো</button>
<button class="b g" id="ai-add" style="display:none;width:100%;margin-top:8px">শেষ উত্তর থেকে কার্ড সেভ করো</button>
</section>
<section id="quiz" class="sec card">
<div class="row" style="margin-top:0"><input id="qt" placeholder="কুইজের টপিক, যেমন: আলোর প্রতিফলন"><button style="flex:none;padding:0 18px" id="qgo">শুরু</button></div>
<div id="qa"><div class="empty">টপিক দাও, আমি MCQ কুইজ বানাব। সঠিক উত্তরে একরকম, ভুলে অন্যরকম আওয়াজ হবে 🔊</div></div>
</section>
<section id="notes" class="sec card">
<textarea id="nt" placeholder="এখানে নোট লেখো — নিজে থেকেই সেভ হবে…"></textarea>
<div class="hint" id="nc" style="margin-top:8px"></div>
</section>
<section id="exam" class="sec card">
<div class="set" style="margin-top:0"><input id="en" placeholder="পরীক্ষার নাম"><input id="ed" type="date" style="max-width:150px"></div>
<button class="b" id="ea" style="width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;color:#fff;font:inherit;font-weight:600">যোগ করো</button>
<ul id="el"></ul>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
});

/* Timer */
const today=new Date().toISOString().slice(0,10);
let st=ld('st',{}); if(st.d!==today) st={d:today,min:0,ses:0};
let fm=ld('fm',25),bm=ld('bm',5),mode='focus',left=fm*60,run=null;
function showStats(){$('sStr').textContent=bn(streak());$('sMin').textContent=bn(st.min);$('sSes').textContent=bn(st.ses)}
function draw(){const m=Math.floor(left/60),s=left%60;$('time').textContent=bn(String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'));$('mode').textContent=mode==='focus'?'পড়ার সময়':'বিরতির সময়';document.title=$('time').textContent+' • পড়ার সাথী'}
function setMode(m){stop();mode=m;left=(m==='focus'?fm:bm)*60;draw()}
function stop(){clearInterval(run);run=null;$('time').classList.remove('run');$('go').textContent='শুরু'}
$('go').onclick=()=>{ac();
 if(run){stop();return}
 $('go').textContent='থামাও';$('time').classList.add('run');
 run=setInterval(()=>{
  left--;draw();
  if(left<=0){
   if(mode==='focus'){st.min+=fm;st.ses++;sv('st',st);markDay();showStats()}
   ring();try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}
   setMode(mode==='focus'?'break':'focus');
  }
 },1000);
};
$('rs').onclick=()=>setMode(mode);
$('m1').onclick=()=>setMode('focus');
$('m2').onclick=()=>setMode('break');
draw();showStats();

/* Tasks */
let tasks=ld('tasks',[]);
function drawTasks(){
 const l=$('tl');l.innerHTML='';
 tasks.forEach((t,i)=>{
  const li=document.createElement('li');if(t.d)li.className='d';
  const c=document.createElement('input');c.type='checkbox';c.checked=t.d;c.onchange=()=>{t.d=c.checked;sv('tasks',tasks);drawTasks()};
  const s=document.createElement('span');s.textContent=t.t;
  const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{tasks.splice(i,1);sv('tasks',tasks);drawTasks()};
  li.append(c,s,x);l.append(li);
 });
 const n=tasks.filter(t=>t.d).length;
 $('pb').style.width=(tasks.length?n/tasks.length*100:0)+'%';
 $('pt').textContent=tasks.length?bn(n)+' / '+bn(tasks.length)+' টি সম্পন্ন':'আজকের পড়ার লক্ষ্য যোগ করো';
}
function addTask(){const v=$('ti').value.trim();if(!v)return;tasks.push({t:v,d:false});$('ti').value='';sv('tasks',tasks);drawTasks()}
$('ta').onclick=addTask;$('ti').onkeydown=e=>{if(e.key==='Enter')addTask()};
drawTasks();

/* Flashcards */
let cards=ld('cards',[{q:'ফটোসিন্থেসিসে কোন গ্যাস নির্গত হয়?',a:'অক্সিজেন'},{q:'Photosynthesis',a:'সালোকসংশ্লেষণ'}]);
let ci=0,flip=false;
function drawCard(){
 if(!cards.length){$('fc').textContent='কোনো কার্ড নেই। নিচে যোগ করো।';$('fh').textContent='';return}
 ci=(ci+cards.length)%cards.length;
 const c=cards[ci];
 $('fc').textContent=flip?c.a:c.q;
 $('fh').textContent='কার্ড '+bn(ci+1)+'/'+bn(cards.length)+' • উল্টাতে ট্যাপ করো';
}
$('fc').onclick=()=>{flip=!flip;drawCard()};
$('nx').onclick=()=>{ci++;flip=false;drawCard()};
$('pv').onclick=()=>{ci--;flip=false;drawCard()};
$('sh').onclick=()=>{cards.sort(()=>Math.random()-.5);ci=0;flip=false;drawCard()};
$('fd').onclick=()=>{if(!cards.length)return;cards.splice(ci,1);sv('cards',cards);flip=false;drawCard()};
$('fadd').onclick=()=>{
 const q=$('fq').value.trim(),a=$('fa').value.trim();if(!q||!a)return;
 cards.push({q,a});sv('cards',cards);$('fq').value='';$('fa').value='';ci=cards.length-1;flip=false;drawCard();
};
drawCard();

/* AI */
const SYS='তুমি একজন বন্ধুসুলভ বাংলাভাষী শিক্ষক। শিক্ষার্থীকে সহজ বাংলায়, ছোট ও পরিষ্কার উত্তর দাও। প্রয়োজনে উদাহরণ দাও। কোনো মার্কডাউন চিহ্ন (যেমন ** বা #) ব্যবহার করবে না।\n';
const PR={explain:'এই টপিকটা একদম সহজ ভাষায়, উদাহরণসহ বুঝিয়ে দাও: ',quiz:'এই টপিক থেকে ৫টা কুইজ প্রশ্ন করো (উত্তর শেষে আলাদা করে দাও): ',summary:'এই টপিকের পয়েন্ট আকারে ছোট সারাংশ দাও: ',cards:'এই টপিক থেকে ৫টা ফ্ল্যাশকার্ড বানাও। প্রতিটি লাইনে এই ফরমেটে: প্রশ্ন | উত্তর — আর কিছু লিখবে না: '};
let hist=[],sample=null,mP='',busy=false,lastCards=false;
claude.use('sample').then(s=>{sample=s;if(!s){$('aiTab').style.display=$('qTab').style.display='none'}}).catch(()=>{$('aiTab').style.display=$('qTab').style.display='none'});
function bub(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;const ch=$('chat');if(ch.firstChild&&ch.firstChild.className==='empty')ch.innerHTML='';ch.append(d);ch.scrollTop=ch.scrollHeight;return d}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{mP=b.dataset.p;$('ai-in').placeholder='টপিক লেখো, তারপর "পাঠাও" চাপো ('+b.textContent.trim()+')';$('ai-in').focus()});
async function ask(){
 const v=$('ai-in').value.trim();if(!v||!sample||busy)return;
 busy=true;$('ai-st').textContent='';$('ai-add').style.display='none';
 const text=mP?PR[mP]+v:v;lastCards=mP==='cards';mP='';$('ai-in').value='';
 bub('u',v);hist.push({role:'user',content:text});
 const out=bub('a','ভাবছি…');
 try{
  const r=await sample([{role:'user',content:SYS+hist.slice(-11)[0].content}].concat(hist.slice(-11).slice(1)),{cache:false,onText:({text})=>{out.textContent=text;$('chat').scrollTop=1e9}});
  out.textContent=r.text;hist.push({role:'assistant',content:r.text});
  if(lastCards)$('ai-add').style.display='block';
 }catch(e){
  hist.pop();
  out.textContent=e&&e.code==='rate_limited'?'অনেক দ্রুত প্রশ্ন হয়ে গেছে, কয়েক সেকেন্ড পরে আবার পাঠাও।':e&&e.code==='not_granted'?'এআই ব্যবহারের অনুমতি দেওয়া হয়নি।':'কিছু একটা সমস্যা হয়েছে, আবার চেষ্টা করো।';
 }
 busy=false;
}
$('ai-go').onclick=ask;
$('ai-add').onclick=()=>{
 const last=hist[hist.length-1];if(!last||last.role!=='assistant')return;
 let n=0;
 last.content.split('\n').forEach(l=>{const p=l.replace(/^[\s\d.\-•*]+/,'').split('|');if(p.length>=2&&p[0].trim()&&p[1].trim()){cards.push({q:p[0].trim(),a:p.slice(1).join('|').trim()});n++}});
 sv('cards',cards);$('ai-add').style.display='none';$('ai-st').textContent=bn(n)+'টি কার্ড সেভ হয়েছে ✅ (কার্ড ট্যাবে দেখো)';drawCard();
};

/* Sound */
let AC=null,ringT=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t,d,ty,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.25,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.02)}
function sfx(k){if(k==='ok'){tone(660,0,.14);tone(880,.13,.14);tone(1320,.26,.3)}else{tone(220,0,.22,'sawtooth',.3);tone(140,.2,.4,'sawtooth',.3)}}
function beat(){[0,.28,.56].forEach(t=>tone(988,t,.16,'square',.2))}
function ring(){stopRing();$('al').style.display='block';beat();let n=0;ringT=setInterval(()=>{beat();if(++n>=8)stopRing()},1200)}
function stopRing(){clearInterval(ringT);ringT=null;$('al').style.display='none'}
$('al').onclick=stopRing;

/* Quiz */
let qz=[],qi=0,sc=0,qd=false,qb=false;
async function startQ(){
 const v=$('qt').value.trim();if(!v||!sample||qb)return;ac();qb=true;
 $('qa').innerHTML='<div class="empty">কুইজ বানাচ্ছি…</div>';
 try{
  let r=await sample.json(SYS+'"'+v+'" টপিক থেকে ৫টা MCQ বানাও। শুধু JSON অ্যারে দাও: [{"q":"প্রশ্ন","o":["অপশন১","অপশন২","অপশন৩","অপশন৪"],"a":সঠিক অপশনের ইনডেক্স (০ থেকে ৩),"w":"এক লাইনে ব্যাখ্যা"}]',{cache:false});
  if(!Array.isArray(r))r=r&&r.questions;
  qz=(r||[]).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length>1&&Number.isInteger(x.a)&&x.o[x.a]!==undefined);
  if(!qz.length)throw 0;
  qi=0;sc=0;qd=false;showQ();
 }catch(e){$('qa').innerHTML='<div class="empty">কুইজ বানাতে পারিনি, আবার চেষ্টা করো।</div>'}
 qb=false;
}
function showQ(){
 const a=$('qa');a.innerHTML='';
 if(qi>=qz.length){a.innerHTML='<div class="fc">🎉 তোমার স্কোর: '+bn(sc)+' / '+bn(qz.length)+'</div>';if(sc>=qz.length/2)sfx('ok');return}
 const q=qz[qi],h=document.createElement('div');h.className='qq';h.textContent=bn(qi+1)+'/'+bn(qz.length)+'. '+q.q;a.append(h);
 q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='qo';b.textContent=t;b.onclick=()=>pick(i,b);a.append(b)});
 const e=document.createElement('div');e.id='qe';e.className='hint';e.style.marginTop='10px';a.append(e);
}
function pick(i,b){
 if(qd)return;qd=true;const q=qz[qi];
 $('qa').querySelectorAll('.qo')[q.a].classList.add('ok');
 if(i===q.a){sc++;sfx('ok')}else{b.classList.add('no');sfx('no')}
 $('qe').textContent=q.w||'';
 const n=document.createElement('button');n.className='b';n.style.cssText='width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;color:#fff;font:inherit;font-weight:600;cursor:pointer';
 n.textContent=qi+1<qz.length?'পরের প্রশ্ন →':'ফলাফল দেখো';n.onclick=()=>{qi++;qd=false;showQ()};$('qa').append(n);
}
$('qgo').onclick=startQ;$('qt').onkeydown=e=>{if(e.key==='Enter')startQ()};

/* Custom timer */
function setT(a,b){fm=Math.min(180,Math.max(1,a|0||25));bm=Math.min(60,Math.max(1,b|0||5));sv('fm',fm);sv('bm',bm);$('fmI').value=fm;$('bmI').value=bm;setMode('focus')}
$('fmI').value=fm;$('bmI').value=bm;
$('fmI').onchange=$('bmI').onchange=()=>setT(+$('fmI').value,+$('bmI').value);
document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.pre.split(',');setT(+a,+c)});
/* Streak */
function dk(d){return d.toISOString().slice(0,10)}
function markDay(){const d=ld('days',[]);if(!d.includes(today)){d.push(today);sv('days',d.slice(-400))}}
function streak(){const d=ld('days',[]);let n=0,c=new Date();if(!d.includes(dk(c)))c.setDate(c.getDate()-1);while(d.includes(dk(c))){n++;c.setDate(c.getDate()-1)}return n}
showStats();
/* AI extras */
$('ai-in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};
$('ai-new').onclick=()=>{hist=[];$('chat').innerHTML='<div class="empty">নতুন চ্যাট শুরু হয়েছে।</div>';$('ai-add').style.display='none'};
/* Notes */
$('nt').value=ld('note','');
function cnt(){$('nc').textContent=bn($('nt').value.trim().split(/\s+/).filter(Boolean).length)+' টি শব্দ • অটো-সেভ'}
$('nt').oninput=()=>{sv('note',$('nt').value);cnt()};cnt();
/* Exams */
let ex=ld('exams',[]);
function drawEx(){
 const l=$('el');l.innerHTML='';
 if(!ex.length){l.innerHTML='<div class="empty">পরীক্ষার তারিখ যোগ করলে কত দিন বাকি দেখাবে।</div>';return}
 const t0=new Date();t0.setHours(0,0,0,0);
 ex.sort((a,b)=>a.d<b.d?-1:1).forEach((e,i)=>{
  const n=Math.round((new Date(e.d+'T00:00:00')-t0)/864e5);
  const li=document.createElement('li'),sp=document.createElement('span'),x=document.createElement('button');
  sp.textContent=e.n+' — '+(n>0?bn(n)+' দিন বাকি':n===0?'আজই পরীক্ষা!':'শেষ হয়ে গেছে');
  x.textContent='✕';x.onclick=()=>{ex.splice(i,1);sv('exams',ex);drawEx()};
  li.append(sp,x);l.append(li);
 });
}
$('ea').onclick=()=>{const n=$('en').value.trim(),d=$('ed').value;if(!n||!d)return;ex.push({n,d});sv('exams',ex);$('en').value='';drawEx()};
drawEx();
</script>
